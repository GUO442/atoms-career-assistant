<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>向前 AI · 求职工作台 — 在线演示</title>
<style>
  :root{
    --ink:#deebf7; --muted:#94a8bd; --accent:#408ce8; --energy:#4a8cf0;
    --red:#e02634; --steel:#1c1e24; --armor:#131416; --rail:#1a1c22;
    --line:#ffffff14; --green:#7bd88f; --orange:#e6a43f; --teal:#3fb5a0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:flex;height:100vh;overflow:hidden;background:var(--armor);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif}
  button{font:inherit;cursor:pointer}
  a{color:var(--accent);text-decoration:none}

  .sidebar{width:248px;flex-shrink:0;display:flex;flex-direction:column;padding:0 18px;
    background:linear-gradient(180deg,var(--armor),var(--rail),var(--armor));border-right:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:12px;padding:48px 0 22px}
  .mark{width:42px;height:42px;border-radius:6px;background:var(--steel);display:flex;align-items:center;justify-content:center;
    font-size:22px;color:var(--accent);font-family:ui-monospace,monospace}
  .logo b{display:block;font-size:21px;font-weight:800;letter-spacing:2px;line-height:1.1}
  .logo small{display:block;font:8px ui-monospace,monospace;letter-spacing:1px;color:var(--energy);margin-top:3px}
  .newconv{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:5px;
    border:1px solid #408ce880;background:var(--accent);color:#fff;font-size:15px;font-weight:500}
  .nav{display:flex;flex-direction:column;gap:3px;padding:17px 0}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;padding:12px 10px;border:0;border-radius:5px;
    background:transparent;color:var(--ink);font-size:15px;text-align:left;position:relative}
  .nav button i{width:21px;text-align:center;font-style:normal;opacity:.9}
  .nav button:hover{background:#ffffff08}
  .nav button.active{background:#408ce81f}
  .nav button.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--energy);border-radius:2px}
  .workspace{display:flex;align-items:center;justify-content:space-between;padding:0 0 8px;color:var(--muted);font-size:13px}
  .ws-name{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:14px;padding-bottom:6px}
  .convlist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;padding-bottom:10px}
  .convlist::-webkit-scrollbar{width:6px}.convlist::-webkit-scrollbar-thumb{background:#2a3242;border-radius:6px}
  .conv{display:flex;align-items:center;gap:7px;width:100%;padding:12px 10px;line-height:1.45;border:0;border-radius:8px;background:transparent;
    color:var(--ink);font-size:13px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv:hover{background:#ffffff07}.conv.active{background:#4a8cf01a}
  .foot{display:flex;flex-direction:column;gap:6px;padding:8px 12px}
  .foot .ver{font:11px ui-monospace,monospace;color:var(--muted)}
  .foot button{border:0;background:none;color:var(--ink);text-align:left;padding:6px 0;font-size:13px;display:flex;align-items:center;gap:8px}
  .foot button.muted{color:var(--muted);font-size:12px}

  main{flex:1;min-width:0;overflow:auto;padding:40px 40px 70px;position:relative}
  .page{display:none}.page.active{display:block}
  .pagehead{display:flex;flex-direction:column;gap:17px;margin-bottom:26px}
  .kicker{display:flex;align-items:center;gap:8px}
  .kicker .bar{width:28px;height:3px;background:var(--red)}
  .kicker .txt{font:10px ui-monospace,monospace;letter-spacing:2.2px;color:var(--energy);font-weight:600}
  .kicker .right{margin-left:auto;font:9px ui-monospace,monospace;letter-spacing:1px;color:var(--muted)}
  .headrow{display:flex;align-items:center;gap:15px}
  .headrow h1{margin:0;font-size:29px;font-weight:800;letter-spacing:1px;font-family:ui-rounded,-apple-system,sans-serif}
  .headrow p{margin:11px 0 0;font-size:13px;color:var(--muted)}
  .runtime{margin-left:auto;padding:14px;border:1px solid #4a8cf047;border-radius:5px;background:var(--steel);text-align:right;white-space:nowrap}
  .runtime b{display:block;font:11px ui-monospace,monospace;color:var(--energy)}
  .runtime span{display:block;font:8px ui-monospace,monospace;letter-spacing:1px;color:var(--muted);margin-top:7px}
  .rule{display:flex;align-items:center;gap:4px}
  .rule .a{width:75px;height:2px;background:#4a8cf080}.rule .b{flex:1;height:1px;background:#4a8cf01f}
  .rule i{width:5px;height:2px;background:#408ce866}

  .surface{position:relative;background:var(--steel);border:1px solid #ffffff14;border-radius:5px;
    box-shadow:0 8px 18px #0000004d;padding:16px;display:flex;flex-direction:column;gap:10px}
  .surface::before{content:"";position:absolute;top:0;left:15px;width:20px;height:2px;background:var(--red)}
  .surface::after{content:"";position:absolute;top:0;left:38px;width:7px;height:2px;background:#4a8cf080}

  .statusrow{display:flex;align-items:center;margin:0 0 14px}
  .statusrow b{font-size:15px;color:var(--accent);font-weight:600}
  .statusrow span{margin-left:auto;font-size:12px;color:var(--muted)}
  .errline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:0 0 22px}
  .errline b{color:var(--ink);font-weight:500}
  h2.members{font-size:22px;font-weight:700;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px}

  .cardhead{display:flex;align-items:flex-start;gap:14px}
  .avatar{position:relative;width:78px;height:86px;border-radius:18px;background:#408ce81a;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;flex-shrink:0}
  .avatar .head{width:21px;height:21px;border-radius:50%;background:#efb491;position:relative}
  .avatar .head::before{content:"";position:absolute;top:-3px;left:-1px;width:24px;height:8px;border-radius:8px;background:#333845}
  .avatar .body{width:34px;height:27px;border-radius:9px;background:var(--accent);color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .avatar .legs{display:flex;gap:7px}.avatar .legs i{width:9px;height:12px;border-radius:5px;background:var(--muted)}
  .avatar .dot{position:absolute;right:3px;bottom:3px;width:12px;height:12px;border-radius:50%;background:var(--muted);border:3px solid var(--steel)}
  .who{display:flex;flex-direction:column;gap:6px;min-width:0}
  .who b{font-size:22px;font-weight:700;line-height:1.1}
  .who small{font-size:12px;color:var(--muted)}
  .who .state{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .who .state i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
  .speech{font-size:12px;padding:10px;border-radius:8px;background:#131416;color:var(--ink)}
  .duty{font-size:12px;color:var(--muted)}
  .big{font:22px/1.2 ui-monospace,monospace;font-weight:600;color:var(--accent)}
  .meta{font-size:12px;color:var(--muted)}.meta2{font-size:13px;color:var(--ink)}
  .tiny{font:10px ui-monospace,monospace;color:var(--muted)}
  .cardfoot{display:flex;align-items:center;gap:10px;margin-top:2px}
  .btn-ghost{padding:6px 14px;border-radius:5px;border:1px solid #ffffff24;background:transparent;color:var(--ink);font-size:13px}
  .btn-start{margin-left:auto;padding:6px 14px;border-radius:5px;border:1px solid #408ce880;background:var(--accent);color:#fff;font-size:13px;font-weight:500}
  .btn-start.blocked{background:#2a2f3a;border-color:#ffffff24;color:var(--muted)}

  .bottombar{position:fixed;left:248px;right:0;bottom:0;padding:12px 40px;display:flex;align-items:center;gap:8px;
    color:var(--muted);font-size:12px;background:var(--armor);border-top:1px solid var(--line);z-index:5}
  .bottombar .ok{color:var(--green)}

  /* tabs / segmented */
  .tabbar{display:inline-flex;padding:4px;border-radius:12px;background:var(--rail);gap:6px;margin:0 0 24px}
  .tabbar button{border:0;background:transparent;color:var(--muted);padding:11px 23px;border-radius:9px;font-size:13px}
  .tabbar button.active{background:var(--steel);color:var(--ink);font-weight:600}
  .toolbar{display:flex;align-items:center;gap:10px;margin:0 0 18px;flex-wrap:wrap}
  .toolbar h3{margin:0;font-size:21px;font-weight:600}
  .toolbar .sub{font-size:12px;color:var(--muted)}
  .toolbar .grow{flex:1}
  .btn-primary{padding:9px 16px;border-radius:8px;border:1px solid #408ce880;background:var(--accent);color:#fff;font-size:13px}
  .search{padding:9px 12px;border-radius:8px;border:1px solid #ffffff24;background:var(--steel);color:var(--ink);font-size:13px;min-width:280px}

  .metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:0 0 26px}
  .metric{background:var(--steel);border:1px solid #ffffff12;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .metric .top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}
  .metric .ico{width:30px;height:30px;border-radius:9px;background:#408ce81a;display:flex;align-items:center;justify-content:center;color:var(--accent)}
  .metric .num{display:flex;align-items:baseline;gap:8px}
  .metric .num b{font-size:32px;font-weight:600;line-height:1}
  .metric .num small{font-size:11px;color:var(--muted)}
  .metric .pct{margin-left:auto;font-size:11px;color:var(--accent);background:#408ce81a;border-radius:20px;padding:3px 9px}

  .sectiontitle{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
  .sectiontitle h4{margin:0;font-size:16px;font-weight:600}
  .sectiontitle span{font-size:11px;color:var(--muted)}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .dist{background:var(--steel);border:1px solid #ffffff12;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:250px}
  .dist .head{display:flex;align-items:center;gap:8px}
  .dist .head b{font-size:14px;font-weight:600}
  .dist .head span{margin-left:auto;font-size:10px;color:var(--muted);background:#ffffff0a;border-radius:20px;padding:3px 8px}
  .dist .body{display:flex;align-items:center;gap:22px}
  .donut{width:132px;height:132px;border-radius:50%;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center}
  .donut::after{content:"";position:absolute;inset:17px;border-radius:50%;background:var(--steel)}
  .donut .center{position:relative;z-index:1;text-align:center}
  .donut .center b{display:block;font-size:24px;font-weight:600;line-height:1}
  .donut .center small{font-size:10px;color:var(--muted)}
  .legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
  .legend .row{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink)}
  .legend .row i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .legend .row em{font-style:normal;margin-left:auto;font-size:11px;color:var(--muted)}
  .legend .row b{width:34px;text-align:right;font-size:11px}
  .donut .zero{font-size:10px;color:var(--muted)}

  .jobcard{background:var(--steel);border:1px solid #ffffff12;border-radius:5px;padding:16px;display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
  .jobcard .jh{display:flex;align-items:center;gap:10px}
  .jobcard .jh b{font-size:15px;font-weight:600}
  .jobcard .jh .badge{margin-left:auto;font-size:11px;padding:3px 9px;border-radius:20px;background:#408ce81a;color:var(--accent)}
  .jobcard .loc{font-size:12px;color:var(--muted)}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;padding:3px 9px;border-radius:20px;background:#ffffff0d;color:#c8d6e8;border:1px solid #ffffff12}
  .tag.ok{color:#8fe0c8;background:#3fb5a01a;border-color:#3fb5a03a}
  .tag.warn{color:#ffd28a;background:#e6a43f1a;border-color:#e6a43f3a}
  .tag.bad{color:#ff9aa3;background:#e026341a;border-color:#e026343a}
  .jobcard a{font-size:12px}

  .skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .skillcard{background:var(--steel);border:1px solid #ffffff12;border-radius:5px;padding:16px;display:flex;flex-direction:column;gap:6px}
  .skillcard b{font-size:14px}
  .skillcard small{font:11px ui-monospace,monospace;color:var(--accent)}
  .skillcard p{margin:0;font-size:12px;color:var(--muted);line-height:1.6}

  .seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--rail);gap:2px;margin:0 0 20px}
  .seg button{border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:7px;font-size:12px}
  .seg button.active{background:var(--steel);color:var(--ink)}
  .qa{background:var(--steel);border:1px solid #ffffff12;border-radius:5px;padding:16px;margin-bottom:12px}
  .qa .qh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .qa .qh b{font-size:15px;font-weight:600}
  .qa .qh .lv{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:20px;background:#e6a43f1a;color:var(--orange)}
  .qa .cat{font-size:11px;color:var(--muted)}
  .qa p{margin:8px 0 0;font-size:13px;color:#c3d2e6;line-height:1.75;white-space:pre-wrap}
  .qa .roles{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .practice{background:var(--steel);border:1px solid #ffffff12;border-radius:5px;padding:16px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start}
  .practice .n{width:34px;height:34px;border-radius:50%;background:#408ce81a;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
  .practice b{display:block;font-size:14px;margin-bottom:4px}
  .practice p{margin:0;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo"><div class="mark">&gt;_</div><div><b>向前 AI</b><small>CAREER WORKSPACE</small></div></div>
    <button class="newconv">💬 新会话</button>
    <div class="nav" id="nav">
      <button data-page="connectors"><i>🔑</i>专家·技能·连接器</button>
      <button data-page="jobs"><i>◎</i>岗位管理</button>
      <button data-page="academy"><i>🎓</i>面试学院</button>
      <button data-page="squad" class="active"><i>⏱</i>小队</button>
    </div>
    <div class="workspace"><span>工作区</span><span>📁</span></div>
    <div class="ws-name">📁 默认工作区</div>
    <div class="convlist" id="convlist"></div>
    <div class="foot">
      <span class="ver">客户端 v2.12.0</span>
      <button class="muted">检查客户端更新</button>
      <button>🎨 IDE · 深色模式</button>
      <button data-page="settings">👤 设置</button>
    </div>
  </aside>

  <main>
    <!-- ================= 小队 ================= -->
    <section class="page active" id="page-squad">
      <div class="pagehead" id="head-squad"></div>
      <div class="statusrow"><b>小队状态：待处理连接</b><span>自动刷新</span></div>
      <div class="errline"><span>▸</span><b>上次完整流程错误</b><span>（子 Agent 当前状态以卡片为准）</span></div>
      <h2 class="members">小队成员</h2>
      <div class="grid" id="grid"></div>
    </section>

    <!-- ================= 岗位管理 ================= -->
    <section class="page" id="page-jobs">
      <div class="pagehead" id="head-jobs"></div>
      <div class="tabbar" id="jobtabs">
        <button data-tab="stats" class="active">总体统计</button>
        <button data-tab="all">全部岗位</button>
        <button data-tab="track">岗位跟进</button>
      </div>
      <div id="jobs-body"></div>
    </section>

    <!-- ================= 面试学院 ================= -->
    <section class="page" id="page-academy">
      <div class="pagehead" id="head-academy"></div>
      <div class="seg" id="acadseg"><button data-sec="kb" class="active">AI岗位知识库</button><button data-sec="practice">面试练习</button></div>
      <div id="academy-body"></div>
    </section>

    <!-- ================= 连接器 ================= -->
    <section class="page" id="page-connectors">
      <div class="pagehead" id="head-connectors"></div>
      <div id="connectors-body"></div>
    </section>

    <!-- ================= 设置 ================= -->
    <section class="page" id="page-settings">
      <div class="pagehead" id="head-settings"></div>
      <div class="surface" style="padding:20px">
        <b style="font-size:16px">真实经历档案</b>
        <p style="color:var(--muted);font-size:13px">本地保存简历与求职偏好；所有定制版本都以这里的真实经历为依据。</p>
        <p style="color:var(--muted);font-size:12px">演示环境不加载真实简历与个人信息。完整版在本机客户端运行。</p>
      </div>
    </section>

    <div class="bottombar"><span class="ok">✓</span><span>当前运行 v2.12.0。已加载本机安装的最新版本。工具和技能可在连接器页面刷新。</span></div>
  </main>

<script>
const D = window.DEMO_DATA || {jobManagement:{jobs:[],dimensions:[],total:0},skills:[],aiInterview:[]};
function h(tag, cls, text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function header(el, title, subtitle){
  el.innerHTML = `
    <div class="kicker"><span class="bar"></span><span class="txt">XIANGQIAN / WORKSPACE</span><span class="right">NATIVE DESKTOP</span></div>

      <div class="runtime"><b>⌗ BOSS 网页接口 · 本机接入</b><span>LOCAL AGENT RUNTIME</span></div></div>
    <div class="rule"><span class="a"></span><span class="b"></span><i></i><i></i><i></i><i></i><i></i></div>`;
}

/* ---------- conversations ---------- */
const conversations = [
  ['查看小筛这个岗位筛选Agent的工作量和结果，只查询，不', true],['帮我找100个岗位', false],['帮我找100个岗位', false],
  ['帮我启动100个BOSS推荐岗位的自动跟进任务。按我的求', false],['你帮我筛选BOSS推荐页面的岗位，先筛选50个。', false],
  ['你好，这是对话修复验证，请简短回复一句中文。', false],['用一句话解释什么是软件测试。', false],['你好', false],
  ['帮我查看今天最新的岗位   10个', false],['@boss-web-tools 帮我筛选10个岗位', false],
  ['现在能帮我在boss上找相关的岗位么   AI测试/测试', false],['帮我查看一批工作岗位   10个  并返回对应的JD', false],
  ['现在能帮我好一个新的岗位JD么', false],['帮我开始投递简历', false],['我现在本地的简历是什么样的', false],
  ['https://www.zhipin.com/job_d', false],['我现在投了哪家企业', false]
];
document.getElementById('convlist').innerHTML = conversations.map(([t,a])=>`<button class="conv${a?' active':''}">${a?'💬 ':''}${t}</button>`).join('');

/* ---------- squad ---------- */
const agents = [
  {name:'小采',role:'岗位采集专员',state:'空闲',duty:'采集推荐岗位、读取并保存真实 JD。',done:'101',exec:'执行中 0 次 · 待处理 0 岗 · 失败 0 岗',extra:'采集 130 岗 · JD已保存 101 份',tasks:'最近 0 次子任务：成功 0 · 失败 0',start:'开始',blocked:false},

/* ---------- 岗位管理 ---------- */
const JM = D.jobManagement || {};
const dims = JM.dimensions || [];
function dim(key){return dims.find(d=>d.key===key)}
const PALETTE=['#386fd6','#7a61d9','#1fa6a8','#e69e40','#d95975','#668aa8','#5da0e8'];
function colorFor(item){
  const k=item.key;
  if(['unknown','unassessed','none'].includes(k))return '#91a3bd';
  if(['sent','replied','reviewed','accepted','offer','recommend','completed'].includes(k))return '#1fa692';
  if(['failed','reject','rejected','excluded','cancelled'].includes(k))return '#d96373';
  if(['pending','waiting','caution','scheduled','invited'].includes(k))return '#e69e40';
  return '#386fd6';
}
function donutHTML(items,total){
  let acc=0; const stops=[];
  (items||[]).forEach((it,i)=>{const c=it.count||0; if(!c)return; const start=total?acc/total*360:0; acc+=c; const end=total?acc/total*360:0; stops.push(`${colorFor(it)} ${start}deg ${end}deg`)});
  const bg = stops.length ? `conic-gradient(${stops.join(',')})` : 'conic-gradient(#ffffff0a 0 360deg)';
  return `<div class="donut" style="background:${bg}"><div class="center"><b>${total||0}</b><small>${total?'总计':'暂无数据'}</small></div></div>`;
}
function distHTML(title, items){
  const total=(items&&items[0]&&items[0].total)||0;
  const rows=(items||[]).map((it,i)=>`<div class="row"><i style="background:${colorFor(it)}"></i><span>${it.label}</span><em>${it.count}</em><b>${it.total?((it.count*100/it.total).toFixed(1)+'%'):''}</b></div>`).join('');
  return `<div class="dist"><div class="head"><b>${title}</b><span>分布</span></div><div class="body">${donutHTML(items,total)}<div class="legend">${rows||'<div class="row"><span>暂无数据</span></div>'}</div></div><div class="tiny">统计基数 ${total} · 数量 / 占比</div></div>`;
}
function jobsStats(){
  const jobs=JM.jobs||[]; const total=JM.total||0;
  const count=(k,v)=>jobs.filter(j=>j[k]===v).length;
  const metrics=[
    ['管理岗位',total,'square.stack.3d.up'],['已联系 HR',count('greet','sent')],['HR 已回复',count('reply','replied')],
    ['简历已发送',count('resume','sent')],['待审核简历',count('review','pending')]
  ];
  let html=`<div class="metrics">`+metrics.map(([t,n])=>`<div class="metric"><div class="top"><span>${t}</span><span class="ico">▦</span></div><div class="num"><b>${n}</b><small>个岗位</small><span class="pct">${total?(n*100/total).toFixed(1):'0.0'}%</span></div></div>`).join('')+`</div>`;
  html+=`<div class="sectiontitle"><h4>岗位画像</h4><span>了解机会的构成</span></div><div class="dgrid">${distHTML('岗位类别',(dim('category')||{}).items)}</div>`;
  html+=`<div class="sectiontitle"><h4>沟通与投递</h4><span>追踪每一步推进</span></div><div class="dgrid">${distHTML('打招呼',(dim('greet')||{}).items)}${distHTML('HR 回复',(dim('reply')||{}).items)}${distHTML('简历发送',(dim('resume')||{}).items)}${distHTML('本人审阅',(dim('review')||{}).items)}</div>`;
  html+=`<div class="sectiontitle"><h4>面试与结果</h4><span>关注后续进展</span></div><div class="dgrid">${distHTML('面试',(dim('interview')||{}).items)}${distHTML('结果',(dim('outcome')||{}).items)}</div>`;
  html+=`<div class="sectiontitle"><h4>平台来源与简历</h4><span>按平台统计，支持后续扩展</span></div><div class="dgrid">${distHTML('平台来源',(dim('platform')||{}).items)}${distHTML('简历版本',JM.resume_distribution||[])}</div>`;
  return html;
}
function badgeFor(j){
  const tags=[];
  tags.push(`<span class="tag">${j.platform_name||'BOSS直聘'}</span>`);
  if(j.category)tags.push(`<span class="tag">${j.category}</span>`);
  const L=j.labels||{};
  const map=[['greet'],['reply'],['resume'],['review'],['interview'],['outcome']];
  map.forEach(([k])=>{if(L[k]){const cls=/不符合|排除|拒绝|失败|未通过/.test(L[k])?'bad':/已|通过|发送|回复/.test(L[k])?'ok':'';tags.push(`<span class="tag ${cls}">${L[k]}</span>`)}});
  return tags.join('');
}
function jobsAll(){
  let jobs=(JM.jobs||[]).slice();
  let html=`<div class="toolbar"><h3>全部岗位</h3><span class="sub">全部 ${JM.total} 个岗位 · 按最近入库排序</span><span class="grow"></span><input class="search" id="jobsearch" placeholder="搜索岗位、公司、城市"><button class="btn-primary">找新岗位</button></div>`;
  html+=`<div id="joblist"></div>`;
  window.__jobs=jobs;
  return html;
}
function renderJobList(q){
  const jobs=(window.__jobs||[]).filter(j=>!q||[j.title,j.company,j.city].join(' ').toLowerCase().includes(q.toLowerCase())).slice(0,40);
  document.getElementById('joblist').innerHTML = jobs.map(j=>`
    <div class="jobcard">
      <div class="jh"><b>${j.company||''} · ${j.title||''}</b><span class="badge">${j.decision==='recommend'?'符合':j.decision==='reject'?'不匹配':j.decision||'待分析'}</span></div>
      <div class="tags">${badgeFor(j)}</div>
      <div class="loc">${[j.city,j.salary,j.experience,j.education].filter(Boolean).join(' · ')}</div>
      ${j.url?`<a href="${j.url}" target="_blank" rel="noopener">查看岗位来源 ↗</a>`:''}
    </div>`).join('') || '<div class="tiny">暂无岗位，调整搜索条件。</div>';
}
function jobsTrack(){
  const jobs=(JM.jobs||[]).filter(j=>j.greet==='sent'||j.reply==='replied'||j.resume==='sent'||j.interview==='scheduled'||j.interview==='invited');
  let html=`<div class="toolbar"><h3>岗位跟进</h3><span class="sub">已沟通 / 已投递 / 面试中的岗位</span></div>`;
  html+=jobs.map(j=>`<div class="jobcard"><div class="jh"><b>${j.company||''} · ${j.title||''}</b></div><div class="tags">${badgeFor(j)}</div><div class="loc">${[j.city,j.salary].filter(Boolean).join(' · ')}</div></div>`).join('') || '<div class="tiny">暂无跟进中的岗位。</div>';
  return html;
}
function renderJobs(tab){
  const body=document.getElementById('jobs-body');
  if(tab==='stats'){body.innerHTML=jobsStats();return}
  if(tab==='all'){body.innerHTML=jobsAll();renderJobList('');const s=document.getElementById('jobsearch');if(s)s.oninput=()=>renderJobList(s.value);return}
  body.innerHTML=jobsTrack();
}
